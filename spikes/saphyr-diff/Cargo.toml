# A throwaway differential harness: what serde_norway (today's YAML crate) and
# serde-saphyr / saphyr read, write and refuse on this repository's real YAML. Its own
# workspace, so nothing it pulls in reaches the product's lockfile, lints or deny.toml.
[package]
name = "saphyr-diff"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
onebudgetspec-core = { path = "../../crates/onebudgetspec-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
serde_norway = "=0.9.42"
serde-saphyr = "=1.3.0"
saphyr = "=0.2.1"
saphyr-parser = "=0.2.1"
serde_path_to_error = "0.1.20"

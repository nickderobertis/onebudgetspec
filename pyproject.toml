# The `onebudgetspec-cli` wheel: the `onebudgetspec` binary, built by maturin and installed
# onto PATH by `pip install onebudgetspec-cli`. Also the root of the uv workspace.
[project]
name = "onebudgetspec-cli"
version = "0.1.2"
description = "The onebudgetspec command line: check, validate and list the budgets registered in budgets.yaml files."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Nick DeRobertis" }]

[project.urls]
Repository = "https://github.com/nickderobertis/onebudgetspec"

[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

# The wheel's command is the compiled binary itself: maturin's `bin` bindings install
# `onebudgetspec` as the wheel's script, so there is no Python function for a
# `[project.scripts]` entry point to name.
[tool.maturin]
bindings = "bin"
manifest-path = "crates/onebudgetspec/Cargo.toml"
strip = true

[tool.uv.workspace]
members = ["sdks/python", "tools"]

# The root is the wheel maturin builds, never a package uv installs into the development
# environment: `uv sync --all-packages` installs the workspace members and their tools only.
[tool.uv]
package = false

schema_version: 1
budgets:
  # Both Mac bounds are required, so this one is not folded into runs-per-change: one run
  # can hold several shared Mac slots at once while the lifecycle count stays within its bound.
  - id: onebudgetspec-macos-jobs-per-run
    description: >-
      Maximum Mac runner job instances per resolved workflow run.
      inner_measure_reason: one run can occupy several shared Mac slots even when
      the lifecycle run count stays within its bound. This constrains simultaneous slots separately from repeated lifecycle queue entries.
    measure: reported
    command: [node, macos-budget.mjs, --metric, jobs-per-run, --telemetry, .telemetry/macos-policy.json]
    unit: jobs
    direction: max
    threshold: 1
  # Both Mac bounds are required, so this one is not folded into jobs-per-run: each run can
  # stay at one Mac job while a change still queues for the shared pool run after run.
  - id: onebudgetspec-macos-runs-per-change
    description: >-
      Maximum distinct Mac-spending automatic workflow runs across the single-push
      lifecycle, excluding explicitly opted-in manual diagnostics. This constrains repeated lifecycle queue entries separately from simultaneous slots.
    measure: reported
    command: [node, macos-budget.mjs, --metric, runs-per-change, --telemetry, .telemetry/macos-policy.json]
    unit: runs
    direction: max
    threshold: 2

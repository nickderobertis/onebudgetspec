# The broader tier over main, nightly: every project, whatever changed. The release pull
# request is swept before it merges, so a main that is still exactly the last release
# (a `v*` tag points at it) is not swept again.
name: sweep

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: swept
        name: Is main exactly the last release?
        run: |
          if git tag --points-at HEAD | grep -q '^v'; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "main is release $(git tag --points-at HEAD | grep '^v' | head -n 1), swept on its pull request; nothing to sweep."
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: extractions/setup-just@v4
        if: steps.swept.outputs.released == 'false'
      - uses: oven-sh/setup-bun@v2
        if: steps.swept.outputs.released == 'false'
        with:
          bun-version-file: package.json
      - uses: astral-sh/setup-uv@v7
        if: steps.swept.outputs.released == 'false'
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        if: steps.swept.outputs.released == 'false'
      - uses: taiki-e/install-action@v2
        if: steps.swept.outputs.released == 'false'
        with:
          tool: cargo-llvm-cov,cargo-nextest,actionlint
      - name: Check every project
        if: steps.swept.outputs.released == 'false'
        run: |
          just bootstrap
          just check-all

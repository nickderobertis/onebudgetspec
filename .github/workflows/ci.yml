# Prove the workspace from a clean checkout: `just bootstrap`, then the gate a contributor
# runs. Pull requests and merges run the affected tier (`just check`); the release pull
# request release-plz opens runs the broader tier (`just check-all`) once, because merging
# it is what releases. `check` is the one required gate job: it aggregates the lanes and
# the supply chain so the required-check set names one stable context.
name: ci

on:
  push:
    branches: [main]
  # `ready_for_review` on top of the defaults: the required checks must run again when a
  # draft pull request is marked ready, or the merge waits on contexts that never report.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The journeys run commands through POSIX `sh`, so the gate covers the platforms the
  # release ships: Linux and macOS.
  gate:
    name: gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Both platforms gate a pull request; a merged commit, already gated, runs once.
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest", "macos-latest"]') || fromJSON('["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The merge base is derived below; a shallow checkout cannot resolve it.
          fetch-depth: 0
      - uses: extractions/setup-just@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      # Reads rust-toolchain.toml, so CI and local builds use the same rustc, clippy and rustfmt.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      # actionlint and shellcheck are pinned in tools/ and synced by `just bootstrap`, so CI
      # and local runs use the same version on every runner.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,cargo-nextest

      - name: Bootstrap
        run: just bootstrap

      - name: Derive the comparison base
        id: base
        env:
          BASE_REF: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: bash scripts/ci-base.sh

      - name: Check the affected projects
        if: ${{ !startsWith(github.head_ref, 'release-plz-') || matrix.os != 'ubuntu-latest' }}
        env:
          NX_BASE: ${{ steps.base.outputs.base }}
          NX_HEAD: HEAD
        run: just check

      # The broader tier, once, on one lane of the pull request whose merge releases; the
      # other lane runs the affected tier as on any pull request.
      - name: Check every project before a release
        if: ${{ startsWith(github.head_ref, 'release-plz-') && matrix.os == 'ubuntu-latest' }}
        run: just check-all

  # Supply chain, Linux-only: the dependency graph is the same on every platform.
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-machete
      - name: Supply-chain gate
        run: just deny

  # The one required gate context: green only when every lane above is.
  check:
    if: ${{ always() }}
    needs: [gate, deny]
    runs-on: ubuntu-latest
    steps:
      - name: Every gate lane passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [ "$result" != success ]; then
              echo "::error::a gate lane finished '$result'; open the failed lane above for its report" >&2
              exit 1
            fi
          done

  # The PR title becomes the squash commit release-plz reads, so a malformed one must not merge.
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Whether the judged lint has a harness credential. Until publishing is provisioned it
  # has none, and the llmlint job below is skipped rather than failed.
  llmlint-guard:
    if: github.event_name == 'pull_request' && github.event.action != 'edited'
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.guard.outputs.enabled }}
    steps:
      - uses: actions/checkout@v7
      - id: guard
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: bash scripts/ci-guard.sh --any CLAUDE_CODE_OAUTH_TOKEN OPENAI_API_KEY

  # The LLM-judge tier over the files this pull request changed. Separate from `check`
  # because it is non-deterministic and needs an authenticated harness.
  llmlint:
    needs: [llmlint-guard]
    if: needs.llmlint-guard.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Fetch main (diff base)
        run: git fetch --no-tags origin main
      - uses: extractions/setup-just@v4
      - uses: astral-sh/setup-uv@v7
      - name: Install oneharness + llmlint
        run: |
          just setup-llmlint
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install the coding harnesses
        run: npm i -g @anthropic-ai/claude-code @openai/codex
      - name: Validate the llmlint config (no model)
        run: just lint-llm-validate --diff-base origin/main
      - name: Lint the changed files
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: just lint-llm-diff origin/main

[project]
name = "onebudgetspec-sdk"
version = "0.1.1"
description = "The onebudgetspec Python SDK: check, validate and list budgets through the onebudgetspec binary, with report models generated from its schema."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Nick DeRobertis" }]
classifiers = ["Typing :: Typed"]
dependencies = ["onebudgetspec-cli==0.1.1", "jsonschema>=4.23", "pydantic>=2.12", "typing-extensions>=4.12"]

[project.urls]
Repository = "https://github.com/nickderobertis/onebudgetspec"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/onebudgetspec_sdk"]

[dependency-groups]
dev = ["datamodel-code-generator>=0.33", "pytest>=9.0", "pytest-cov>=7.1", "ruff>=0.16.4", "ty>=0.0.74"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
onebudgetspec-cli = { workspace = true }
